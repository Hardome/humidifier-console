openapi: 3.1.0
info:
  title: Humidifier Console
  version: 1.0.0
  description: Local LAN console; no data export API.
servers:
- url: /
tags:
- name: state
  description: state
- name: capabilities
  description: capabilities
- name: diagnostics
  description: diagnostics
- name: commands
  description: commands
- name: events
  description: events
- name: history
  description: history
- name: scenes
  description: scenes
- name: schedules
  description: schedules
- name: automations
  description: automations
- name: settings
  description: settings
- name: telegram
  description: telegram
paths:
  /api/v1/state:
    $ref: ./src/state.yaml#/~1api~1v1~1state
  /api/v1/state/refresh:
    $ref: ./src/state.yaml#/~1api~1v1~1state~1refresh
  /api/v1/capabilities:
    $ref: ./src/capabilities.yaml#/~1api~1v1~1capabilities
  /api/v1/capabilities/verify:
    $ref: ./src/capabilities.yaml#/~1api~1v1~1capabilities~1verify
  /api/v1/diagnostics:
    $ref: ./src/diagnostics.yaml#/~1api~1v1~1diagnostics
  /api/v1/commands:
    $ref: ./src/commands.yaml#/~1api~1v1~1commands
  /api/v1/commands/{id}:
    $ref: ./src/commands.yaml#/~1api~1v1~1commands~1{id}
  /api/v1/events:
    $ref: ./src/events.yaml#/~1api~1v1~1events
  /api/v1/history:
    $ref: ./src/history.yaml#/~1api~1v1~1history
  /api/v1/scenes:
    $ref: ./src/scenes.yaml#/~1api~1v1~1scenes
  /api/v1/scenes/{id}:
    $ref: ./src/scenes.yaml#/~1api~1v1~1scenes~1{id}
  /api/v1/schedules:
    $ref: ./src/schedules.yaml#/~1api~1v1~1schedules
  /api/v1/schedules/{id}:
    $ref: ./src/schedules.yaml#/~1api~1v1~1schedules~1{id}
  /api/v1/automations:
    $ref: ./src/automations.yaml#/~1api~1v1~1automations
  /api/v1/automations/{id}:
    $ref: ./src/automations.yaml#/~1api~1v1~1automations~1{id}
  /api/v1/scenes/{id}/run:
    $ref: ./src/scenes.yaml#/~1api~1v1~1scenes~1{id}~1run
  /api/v1/settings:
    $ref: ./src/settings.yaml#/~1api~1v1~1settings
  /api/v1/telegram/test:
    $ref: ./src/telegram.yaml#/~1api~1v1~1telegram~1test
  /api/v1/capabilities/restore:
    $ref: ./src/capabilities.yaml#/~1api~1v1~1capabilities~1restore
components:
  schemas:
    Error:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
        message:
          type: string
        request_id:
          type: string
      required:
      - code
      - message
      - request_id
    DeviceInfo:
      type: object
      additionalProperties: false
      properties:
        model:
          type: string
        firmware:
          anyOf:
          - type: string
          - type: 'null'
        hardware:
          anyOf:
          - type: string
          - type: 'null'
      required:
      - model
      - firmware
      - hardware
    Values:
      type: object
      additionalProperties: false
      properties:
        power:
          type: boolean
        mode:
          type: integer
        target_humidity:
          type: integer
        fault:
          type: integer
        water_code:
          type: integer
        auto_dry:
          type: boolean
        status:
          type: integer
        humidity:
          type: number
        temperature:
          type: number
        brightness:
          type: integer
        sound:
          type: boolean
        child_lock:
          type: boolean
        speed:
          type: integer
        country_code:
          type: integer
        clean:
          type: boolean
        clean_minutes:
          type: integer
        level:
          type: integer
        clean_end_display:
          type: integer
      required:
      - power
      - mode
      - target_humidity
      - fault
      - water_code
      - auto_dry
      - status
      - humidity
      - temperature
      - brightness
      - sound
      - child_lock
      - speed
      - country_code
      - clean
      - clean_minutes
      - level
      - clean_end_display
    State:
      type: object
      additionalProperties: false
      properties:
        online:
          type: boolean
        stale:
          type: boolean
        measured_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
        values:
          anyOf:
          - $ref: '#/components/schemas/Values'
          - type: 'null'
        device:
          $ref: '#/components/schemas/DeviceInfo'
        database_ok:
          type: boolean
        error:
          anyOf:
          - type: string
          - type: 'null'
      required:
      - online
      - stale
      - measured_at
      - values
      - device
      - database_ok
      - error
    Capability:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          enum:
          - power
          - mode
          - target_humidity
          - auto_dry
          - brightness
          - sound
          - child_lock
          - clean
          - level
          - clean_end_display
          - cycle_mode
        status:
          type: string
          enum:
          - declared
          - verified
          - unsupported
        requires_observation:
          type: boolean
      required:
      - name
      - status
      - requires_observation
    Capabilities:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Capability'
      required:
      - items
    CommandInput:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          enum:
          - power
          - mode
          - target_humidity
          - auto_dry
          - brightness
          - sound
          - child_lock
          - clean
          - level
          - clean_end_display
          - cycle_mode
        value:
          anyOf:
          - type: boolean
          - type: integer
          - type: 'null'
        source:
          type: string
          enum:
          - panel
          - api
      required:
      - name
      - value
    CommandResult:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        at:
          type: string
          format: date-time
        name:
          type: string
        value:
          type: object
          additionalProperties: false
          properties:
            value:
              anyOf:
              - type: boolean
              - type: integer
              - type: 'null'
          required:
          - value
        source:
          type: string
        status:
          type: string
          enum:
          - pending
          - running
          - confirmed
          - failed
          - unknown
        error:
          anyOf:
          - type: string
          - type: 'null'
      required:
      - id
      - at
      - name
      - value
      - source
      - status
      - error
    Verification:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          enum:
          - power
          - mode
          - target_humidity
          - auto_dry
          - brightness
          - sound
          - child_lock
          - clean
          - level
          - clean_end_display
          - cycle_mode
        value:
          anyOf:
          - type: boolean
          - type: integer
          - type: 'null'
        observed:
          type: boolean
      required:
      - name
      - value
      - observed
    VerificationResult:
      type: object
      additionalProperties: false
      properties:
        verified:
          type: boolean
      required:
      - verified
    EventItem:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        at:
          type: string
          format: date-time
        type:
          type: string
        source:
          type: string
        message:
          type: string
        data:
          type: object
          additionalProperties: true
      required:
      - id
      - at
      - type
      - source
      - message
      - data
    Events:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/EventItem'
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
      required:
      - items
      - total
      - limit
      - offset
    HistoryPoint:
      type: object
      additionalProperties: false
      properties:
        at:
          type: string
          format: date-time
        count:
          type: integer
        humidity:
          type: number
        temperature:
          type: number
        humidity_min:
          type: number
        humidity_max:
          type: number
        temperature_min:
          type: number
        temperature_max:
          type: number
        target_humidity:
          type: number
        speed:
          type: number
        power_seconds:
          type: number
        status:
          type: integer
      required:
      - at
      - count
      - humidity
      - temperature
      - humidity_min
      - humidity_max
      - temperature_min
      - temperature_max
      - target_humidity
      - speed
      - power_seconds
      - status
    HistoryStats:
      type: object
      additionalProperties: false
      properties:
        humidity_min:
          anyOf:
          - type: number
          - type: 'null'
        humidity_max:
          anyOf:
          - type: number
          - type: 'null'
        humidity_mean:
          anyOf:
          - type: number
          - type: 'null'
        temperature_min:
          anyOf:
          - type: number
          - type: 'null'
        temperature_max:
          anyOf:
          - type: number
          - type: 'null'
        temperature_mean:
          anyOf:
          - type: number
          - type: 'null'
        power_seconds:
          type: number
        sample_count:
          type: integer
      required:
      - humidity_min
      - humidity_max
      - humidity_mean
      - temperature_min
      - temperature_max
      - temperature_mean
      - power_seconds
      - sample_count
    History:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/HistoryPoint'
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
        stats:
          $ref: '#/components/schemas/HistoryStats'
      required:
      - items
      - total
      - limit
      - offset
      - stats
    Action:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          enum:
          - power
          - mode
          - target_humidity
          - auto_dry
          - brightness
          - sound
          - child_lock
          - clean
          - level
          - clean_end_display
          - cycle_mode
        value:
          anyOf:
          - type: boolean
          - type: integer
          - type: 'null'
      required:
      - name
      - value
    RuleConfig:
      type: object
      additionalProperties: false
      properties:
        actions:
          type: array
          items:
            $ref: '#/components/schemas/Action'
        days:
          type: array
          items:
            type: integer
            minimum: 0
            maximum: 6
        time:
          type: string
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
        low:
          type: integer
          minimum: 0
          maximum: 99
        high:
          type: integer
          minimum: 1
          maximum: 100
      required: []
    RuleInput:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        enabled:
          type: boolean
        priority:
          type: integer
          minimum: -1000
          maximum: 1000
        config:
          $ref: '#/components/schemas/RuleConfig'
      required:
      - name
      - enabled
      - priority
      - config
    RuleItem:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        kind:
          type: string
          enum:
          - scene
          - schedule
          - automation
        last_run:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
        name:
          type: string
          minLength: 1
          maxLength: 100
        enabled:
          type: boolean
        priority:
          type: integer
          minimum: -1000
          maximum: 1000
        config:
          $ref: '#/components/schemas/RuleConfig'
      required:
      - id
      - kind
      - last_run
      - name
      - enabled
      - priority
      - config
    Rules:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RuleItem'
      required:
      - items
    RunResult:
      type: object
      additionalProperties: false
      properties:
        commands:
          type: array
          items:
            $ref: '#/components/schemas/CommandResult'
      required:
      - commands
    Notifications:
      type: object
      additionalProperties: false
      properties:
        enabled:
          type: boolean
        categories:
          type: array
          items:
            type: string
            enum:
            - fault
            - connection
            - command_unknown
            - cleaning
            - humidity
            - no_growth
            - washing
            - water
        humidity_low:
          anyOf:
          - type: integer
            minimum: 0
            maximum: 99
          - type: 'null'
        humidity_high:
          anyOf:
          - type: integer
            minimum: 1
            maximum: 100
          - type: 'null'
        no_growth_minutes:
          anyOf:
          - type: integer
            minimum: 10
            maximum: 10080
          - type: 'null'
        washing_days:
          anyOf:
          - type: integer
            minimum: 1
            maximum: 365
          - type: 'null'
        last_washed:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
      required:
      - enabled
      - categories
      - humidity_low
      - humidity_high
      - no_growth_minutes
      - washing_days
      - last_washed
    SettingsInput:
      type: object
      additionalProperties: false
      properties:
        timezone:
          type: string
        retention_days:
          type: integer
          minimum: 1
          maximum: 3650
        manual_pause_minutes:
          type: integer
          minimum: 0
          maximum: 1440
        pause_until:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
        off_timer:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
        minimum_switch_seconds:
          type: integer
          minimum: 300
          maximum: 86400
        notifications:
          $ref: '#/components/schemas/Notifications'
        water_labels:
          $ref: '#/components/schemas/WaterLabels'
      required:
      - timezone
      - retention_days
      - manual_pause_minutes
      - pause_until
      - off_timer
      - minimum_switch_seconds
      - notifications
      - water_labels
    Settings:
      type: object
      additionalProperties: false
      properties:
        timezone:
          type: string
        retention_days:
          type: integer
          minimum: 1
          maximum: 3650
        manual_pause_minutes:
          type: integer
          minimum: 0
          maximum: 1440
        pause_until:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
        off_timer:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
        minimum_switch_seconds:
          type: integer
          minimum: 300
          maximum: 86400
        notifications:
          $ref: '#/components/schemas/Notifications'
        telegram_configured:
          type: boolean
        restoration_pending:
          type: boolean
        water_labels:
          $ref: '#/components/schemas/WaterLabels'
      required:
      - timezone
      - retention_days
      - manual_pause_minutes
      - pause_until
      - off_timer
      - minimum_switch_seconds
      - notifications
      - telegram_configured
      - restoration_pending
      - water_labels
    Diagnostics:
      type: object
      additionalProperties: false
      properties:
        device:
          $ref: '#/components/schemas/DeviceInfo'
        error:
          anyOf:
          - type: string
          - type: 'null'
        consecutive_failures:
          type: integer
        database_ok:
          type: boolean
        specification:
          type: string
        cloud_independence_tested:
          type: boolean
      required:
      - device
      - error
      - consecutive_failures
      - database_ok
      - specification
      - cloud_independence_tested
    TelegramResult:
      type: object
      additionalProperties: false
      properties:
        sent:
          type: boolean
      required:
      - sent
    WaterLabels:
      type: object
      additionalProperties: false
      properties:
        '0':
          type: string
          enum:
          - unknown
          - low
          - normal
        '1':
          type: string
          enum:
          - unknown
          - low
          - normal
        '2':
          type: string
          enum:
          - unknown
          - low
          - normal
      required:
      - '0'
      - '1'
      - '2'
    RestoreInput:
      type: object
      additionalProperties: false
      properties:
        observed:
          type: boolean
      required:
      - observed
security: []
