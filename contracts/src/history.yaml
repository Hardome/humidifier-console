/api/v1/history:
  get:
    operationId: getHistory
    summary: getHistory
    tags:
    - history
    security: []
    responses:
      '200':
        description: Success
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/History'
      '403':
        description: Cross-origin request rejected
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Error'
      '404':
        description: Safe error
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Error'
      '409':
        description: Safe error
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Error'
      '422':
        description: Safe error
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Error'
      '503':
        description: Safe error
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Error'
    parameters:
    - name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 100
    - name: offset
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
    - name: start
      in: query
      required: false
      schema: &id001
        type: string
        format: date-time
    - name: end
      in: query
      required: false
      schema: *id001
