/api/v1/scenes:
  get:
    operationId: listScenes
    summary: listScenes
    tags:
    - scenes
    security: []
    responses:
      '200':
        description: Success
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Rules'
      '403':
        description: Cross-origin request rejected
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Error'
      '404':
        description: Safe error
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Error'
