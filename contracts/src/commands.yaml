/api/v1/commands:
  post:
    operationId: createCommand
    summary: createCommand
    tags:
    - commands
    security: []
    responses:
      '202':
        description: Success
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/CommandResult'
      '403':
        description: Cross-origin request rejected
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Error'
      '404':
        description: Safe error
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Error'
      '409':
        description: Safe error
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Error'
      '422':
        description: Safe error
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Error'
      '503':
        description: Safe error
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Error'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/CommandInput'
/api/v1/commands/{id}:
  get:
    operationId: getCommand
    summary: getCommand
    tags:
    - commands
    security: []
    responses:
      '200':
        description: Success
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/CommandResult'
      '403':
        description: Cross-origin request rejected
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Error'
      '404':
        description: Safe error
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Error'
      '409':
        description: Safe error
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Error'
      '422':
        description: Safe error
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Error'
      '503':
        description: Safe error
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Error'
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
