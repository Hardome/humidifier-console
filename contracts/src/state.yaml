/api/v1/state:
  get:
    operationId: getState
    summary: getState
    tags:
    - state
    security: []
    responses:
      '200':
        description: Success
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/State'
      '403':
        description: Cross-origin request rejected
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Error'
      '404':
        description: Safe error
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Error'
      '409':
        description: Safe error
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Error'
      '422':
        description: Safe error
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Error'
      '503':
        description: Safe error
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Error'
