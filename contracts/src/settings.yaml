      '409':
        description: Safe error
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Error'
      '422':
        description: Safe error
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Error'
      '503':
        description: Safe error
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Error'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/SettingsInput'
