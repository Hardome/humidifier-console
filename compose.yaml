name: humidifier-console
x-database: &database
  PGHOST: postgres
  PGUSER: humidifier
  PGDATABASE: humidifier
  PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: humidifier
      POSTGRES_USER: humidifier
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres18-data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U humidifier -d humidifier']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  migrate:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment: *database
    command: [python, -m, alembic, upgrade, head]
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      <<: *database
      DEVICE_CONFIG: /run/secrets/device.json
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    volumes:
      - type: bind
        source: ./device.local.json
        target: /run/secrets/device.json
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
    stop_grace_period: 45s
    restart: unless-stopped
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    ports:
      - '8080:80'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1/health]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
volumes:
  postgres18-data:
